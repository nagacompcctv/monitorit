services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitorit-app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/monitorit
      - NODE_ENV=production
    depends_on:
      - postgres
    networks:
      - monitorit-network

  postgres:
    image: postgres:15-alpine
    container_name: monitorit-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=monitorit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - monitorit-network

volumes:
  postgres-data:

networks:
  monitorit-network:
    driver: bridge
